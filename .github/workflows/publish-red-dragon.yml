name: Publish verified DragonSpin ONE 1.3.18 APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-red-dragon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reassemble public signed APK and verify exact binary
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://elvbtmookoysavtbzuln.supabase.co/storage/v1/object/public/dragonspin-apk-temp"
          curl -fLsS --retry 3 --max-time 180 "$BASE/DragonSpin-1.3.18-build38.apk.part00" -o part00
          curl -fLsS --retry 3 --max-time 180 "$BASE/DragonSpin-1.3.18-build38.apk.part01" -o part01
          test "$(stat -c%s part00)" -eq 28000000
          test "$(stat -c%s part01)" -eq 27709314
          cat part00 part01 > DragonSpin-1.3.18.apk
          test "$(stat -c%s DragonSpin-1.3.18.apk)" -eq 55709314
          echo "09acb6b58ef124d23ce6350b41041ef4d986b541d9f0ca95903554df23a5d140  DragonSpin-1.3.18.apk" | sha256sum --check
          unzip -t DragonSpin-1.3.18.apk >/dev/null

      - name: Verify APK signature, version, package and continuity with old Android
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose DragonSpin-1.3.18.apk
          "$AAPT" dump badging DragonSpin-1.3.18.apk | grep -F "package: name='pl.rotacjadruzyn' versionCode='38'"
          curl -fLsS --retry 3 --max-time 180 \
            'https://github.com/andre666000/Rotacjadruzyn2.0/releases/download/1.3.9-build29/DragonSpin-1.3.9.apk' \
            -o old.apk
          echo "Old APK signer output:"
          "$APKSIGNER" verify --print-certs old.apk | grep -E 'Signer|certificate' | head -n 12
          echo "New APK signer output:"
          "$APKSIGNER" verify --print-certs DragonSpin-1.3.18.apk | grep -E 'Signer|certificate' | head -n 12
          OLD_CERT="$("$APKSIGNER" verify --print-certs old.apk | awk 'tolower($0) ~ /sha-256/ {print $NF;exit}')"
          NEW_CERT="$("$APKSIGNER" verify --print-certs DragonSpin-1.3.18.apk | awk 'tolower($0) ~ /sha-256/ {print $NF;exit}')"
          echo "Build 29 signer SHA256: ${OLD_CERT:-missing}"
          echo "Build 38 signer SHA256: ${NEW_CERT:-missing}"
          curl -fLsS --retry 3 --max-time 180 \
            'https://github.com/andre666000/Rotacjadruzyn2.0/releases/download/1.3.3-build23/DragonSpin-v1.3.3-build23.apk' \
            -o baseline23.apk
          BASE_CERT="$("$APKSIGNER" verify --print-certs baseline23.apk | awk 'tolower($0) ~ /sha-256/ {print $NF;exit}')"
          echo "Build 23 signer SHA256: ${BASE_CERT:-missing}"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "Signed Android APK matches existing public build 29 signing certificate"

      - name: Create public direct-download GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=1.3.18-build38
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: refusing to overwrite it"
            exit 1
          fi
          gh release create "$TAG" DragonSpin-1.3.18.apk \
            --target "$GITHUB_SHA" \
            --title "DragonSpin ONE 1.3.18 build 38 — Smocza Arena" \
            --notes "DragonSpin ONE 1.3.18 (build 38). Nowa filmowa Arena: szczegółowy ognisty smok 2D, rzeczywiste nicki poruszające się po orbitach i przelatujące do drużyn MAX MIX, karty drużyn zapełniające się po przylocie graczy, korony liderów oraz finał wyników. Prostsze dodawanie zdjęć: aparat, galeria i schowek; zachowano OCR Android ML Kit, rotacje, funkcje i uprawnienia OWNER/ROOT. Wydanie podpisane tym samym certyfikatem co dotychczasowa aplikacja — zainstaluj na poprzedniej wersji bez odinstalowywania. Animowana grafika smoka jest 2D, nie modelem 3D. SHA256 APK: 09acb6b58ef124d23ce6350b41041ef4d986b541d9f0ca95903554df23a5d140."
