name: Verify existing DragonSpin Android APK signature

on:
  push:
    branches:
      - release-validation-20261108
    paths:
      - ".github/workflows/verify-existing-apk-signature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing PUBLIC Android 1.3.3 APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 \
            "https://github.com/andre666000/Rotacjadruzyn2.0/releases/download/1.3.3-build23/DragonSpin-v1.3.3-build23.apk" \
            -o original-1.3.3.apk
          test -s original-1.3.3.apk
      - name: Print public installer's signature SHA256
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs original-1.3.3.apk
