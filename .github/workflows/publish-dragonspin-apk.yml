name: Publish DragonSpin Android 1.3.3 build 23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dragonspin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOWNLOAD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ab30-8210-ae56-4d81095dead7/raw?se=2026-11-02T04%3A41%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=4e5fe2cf-3075-5edd-991b-75ddabcd86ef&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T23%3A45%3A13Z&ske=2026-11-02T23%3A45%3A13Z&sks=b&skv=2026-02-06&sig=Vbyf2iLYoAv4iMpHjtb7g8bTX1OReORAcjQbuRQIS1s%3D'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch verified signed APK archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error "$DOWNLOAD_URL" --output artifact.zip
          echo 'ac3c5f7ae2587afac721305700c76485eac9586933893112dfc66cc7ca79f631  artifact.zip' | sha256sum --check --status
          unzip -p artifact.zip RotacjaDruzyn.apk > DragonSpin-v1.3.3-build23.apk
          echo 'c828bac430b2da4a7564bed3ab1eb4a51c0bb40f48833065a359bec784fedf83  DragonSpin-v1.3.3-build23.apk' | sha256sum --check --status
      - name: Publish APK on public GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.3.3-build23 >/dev/null 2>&1; then
            gh release upload 1.3.3-build23 DragonSpin-v1.3.3-build23.apk --clobber
          else
            gh release create 1.3.3-build23 DragonSpin-v1.3.3-build23.apk --target main --title 'DragonSpin Android 1.3.3 (build 23)' --notes 'Obowiązkowa aktualizacja: indywidualne wyjątki dostępu Android/WEB sterowane przez OWNER. Podpisana aktualizacja zachowuje zainstalowaną aplikację.'
          fi
