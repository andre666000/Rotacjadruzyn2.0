name: Publish verified DragonSpin 1.3.8 APK
on:
  push:
    branches:
      - transfer/android-1.3.8
    paths:
      - "transfer/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
      - name: Reassemble and verify Android APK
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          m=json.loads(Path('transfer/manifest.json').read_text())
          assert m['app']=='pl.rotacjadruzyn' and m['version_code']==28
          assert m['asset_name']=='DragonSpin-v1.3.8-build28.apk'
          assert 1<=len(m['parts'])<=32
          chunks=[]
          for i,p in enumerate(m['parts']):
              v=(Path('transfer')/f'part{i:02}.b64').read_text()
              assert hashlib.sha256(v.encode('ascii')).hexdigest()==p['sha256']
              chunks.append(v)
          raw=base64.b64decode(''.join(chunks),validate=True)
          assert len(raw)==m['size_bytes']
          assert hashlib.sha256(raw).hexdigest()==m['expected_sha256']
          Path(m['asset_name']).write_bytes(raw)
          print('Verified APK SHA256:',m['expected_sha256'])
          PY
          unzip -t DragonSpin-v1.3.8-build28.apk > /dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose DragonSpin-v1.3.8-build28.apk
      - name: Publish public direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=1.3.8-build28
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; will not overwrite signed APK"
            exit 1
          fi
          gh release create "$TAG" DragonSpin-v1.3.8-build28.apk \
            --target "$GITHUB_SHA" \
            --title "DragonSpin 1.3.8 build 28 — ekran rotacji jak WEB" \
            --notes "Natywne ekrany rotacji jak WEB: 4 motywy A666, MAX MIX, liderzy, wybór 3/4 graczy, kolejność drużyn, eksport PNG. Android OCR ML Kit niezmieniony. Wymaga Androida 6.0+."
